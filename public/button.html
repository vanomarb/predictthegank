<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alert button — Predict the Gank</title>
  <meta name="description" content="One button. Press it to alert everyone.">
  <link rel="icon" type="image/png" href="/favicon.png">

  <!-- Same setup as index.html/admin.html — see the comment there. -->
  <link rel="stylesheet" href="/shared.css">
  <script src="/tailwind-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <!-- #alertBtn's glow color needs to react live to a theme toggle mid-session.
       Tailwind's shadow-[...] utility routes color through --tw-shadow-color's
       fallback, and this browser engine doesn't re-evaluate a var() nested two
       levels deep inside that fallback on a custom-property change (confirmed:
       it's correct on a fresh load in either theme, just frozen after a runtime
       toggle) — a plain box-shadow declaration with one level of var() does
       react live, so this one rule is exempted from "Tailwind utilities only." -->
  <style>
    #alertBtn {
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.45), 0 -4px 10px rgba(var(--status-bad-rgb), 0.25), 0 0 18px rgba(0, 0, 0, 0.35);
      transition: box-shadow 0.2s ease-out;
    }
    #alertBtn:hover:not(:disabled) {
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.45), 0 -4px 10px rgba(var(--status-bad-rgb), 0.25), 0 0 28px rgba(var(--status-bad-rgb), 0.85);
    }
  </style>
</head>

<body class="flex min-h-screen flex-col overflow-x-clip bg-ink-950 text-fg transition-colors duration-200">

  <header class="mx-auto flex w-full max-w-[820px] flex-wrap items-center justify-between gap-3 px-5 pt-[22px]">
    <a href="/"
      class="flex items-center gap-2.5 rounded-md focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-400">
      <img src="/logo.png" alt="" width="26" height="26"
        class="size-[26px] shrink-0 dark:invert max-[380px]:size-[22px]">
      <span class="text-[13px] uppercase tracking-[0.1em] text-fg-muted max-[380px]:text-[11px]">Predict the Gank</span>
    </a>
    <div class="flex items-center gap-[14px] max-[380px]:gap-2.5">
      <select id="soundPicker" aria-label="Alert alarm sound"
        class="h-[34px] cursor-pointer rounded-full border border-line bg-transparent px-2.5 text-[12px] text-fg-muted transition-colors duration-150 hover:bg-ink-800 hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"></select>
      <button id="notifyToggle" type="button" aria-label="Turn on roam alerts" aria-pressed="false"
        class="inline-flex size-[34px] cursor-pointer items-center justify-center rounded-full border border-line bg-transparent p-0 text-[17px] text-fg-muted transition-colors duration-150 hover:bg-ink-800 hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400 disabled:cursor-not-allowed disabled:opacity-40 aria-pressed:border-amber-500 aria-pressed:text-amber-300"></button>
      <button id="themeToggle" type="button" aria-label="Toggle light/dark theme"
        class="inline-flex size-[34px] cursor-pointer items-center justify-center rounded-full border border-line bg-transparent p-0 text-[17px] text-fg-muted transition-colors duration-150 hover:bg-ink-800 hover:text-fg focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400"></button>
    </div>
  </header>

  <!-- The whole point of this page: one button, dead centre, nothing else. -->
  <main class="mx-auto flex w-full max-w-[820px] flex-1 flex-col items-center justify-center px-5 py-16">
    <!-- Rim: a neutral bezel around the button, same idea as the CodePen
         reference (codepen.io/John2606/pen/bGJvMYW) this is modeled on, but
         built from this app's own ink tokens instead of hardcoded white/navy
         so it re-themes with the rest of the app. -->
    <div class="relative flex items-center justify-center rounded-full p-[clamp(14px,2.5vw,26px)]
                h-[clamp(220px,45vw,360px)] w-[clamp(220px,45vw,360px)]
                bg-[linear-gradient(145deg,var(--ink-700)_0%,var(--ink-950)_78%)]
                shadow-[0_10px_40px_rgba(0,0,0,0.35)]">
      <!-- The button itself: a red gradient cap with a glossy drop-shadow
           stack (dark below, warm highlight above, soft ambient glow),
           built from --status-bad / --status-bad-rgb so it re-themes. -->
      <button id="alertBtn" type="button" aria-label="Alert everyone" disabled
        class="group relative h-full w-full cursor-pointer rounded-full border-0
               bg-[linear-gradient(100deg,var(--status-bad),color-mix(in_srgb,var(--status-bad)_55%,black))]
               focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-amber-400
               disabled:cursor-not-allowed disabled:opacity-50">
        <!-- The inner cap: grows on hover/press to read as a "push", exactly
             the CodePen reference's .btn-inner effect, done with an inset
             percentage instead of a fixed rem so it scales with the button. -->
        <span aria-hidden="true"
          class="absolute inset-[6%] rounded-full
                 bg-[linear-gradient(135deg,var(--status-bad),color-mix(in_srgb,var(--status-bad)_55%,black))]
                 transition-[inset] duration-200 ease-out
                 group-hover:inset-[3%] group-active:inset-[8%]"></span>
        <span class="relative z-10 flex flex-col items-center gap-1 text-white [text-shadow:0_1px_3px_rgba(0,0,0,0.6)]">
          <span class="text-[clamp(22px,5vw,34px)]" data-icon="bell"></span>
          <span class="text-[clamp(13px,2.2vw,17px)] font-bold uppercase tracking-[0.12em]">Alert</span>
        </span>
      </button>
    </div>
    <p id="alertBtnHint" class="mt-6 text-xs text-fg-faint">Press it to alert everyone.</p>
  </main>

  <div id="toastHost"
    class="pointer-events-none fixed top-[88px] left-1/2 z-50 w-[min(420px,calc(100vw-24px))] -translate-x-1/2"
    aria-live="polite"></div>

  <!-- New-device onboarding: gated by localStorage, not a network check, so
       this page can decide instantly whether to ask — see button.js. -->
  <div id="nicknameModal" style="display:none;" role="dialog" aria-modal="true" aria-labelledby="nicknameModalTitle"
    class="fixed inset-0 z-[80] flex items-center justify-center bg-[rgba(10,8,4,0.55)] p-5">
    <div class="w-full max-w-[380px] rounded-[20px] border border-line bg-[linear-gradient(180deg,var(--ink-900),var(--ink-800))] p-6">
      <h2 id="nicknameModalTitle" class="mb-1 text-[26px] font-semibold tracking-[-0.015em]">Pick a nickname</h2>
      <p class="mb-5 text-sm text-fg-muted">So your alert can say who sent it. An existing nickname signs back into that account.</p>
      <form id="nicknameForm" autocomplete="on" class="flex flex-col">
        <div class="mb-3.5 flex flex-col gap-1.5">
          <label for="nicknameInput" class="text-[11px] uppercase tracking-[0.08em] text-fg-faint">Nickname</label>
          <input id="nicknameInput" name="name" placeholder="8 chars max" autocomplete="username"
            maxlength="8" pattern="[A-Za-z0-9_\-]{1,8}"
            class="rounded-md border border-line-strong bg-ink-950 px-[13px] py-[11px] text-sm text-fg placeholder:text-fg-faint focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-amber-400">
        </div>
        <button id="nicknameSubmitBtn" type="submit"
          class="cursor-pointer rounded-md border border-amber-500 bg-amber-500 px-[18px] py-3 text-sm font-semibold text-amber-ink transition-[transform,border-color,background-color] duration-150 hover:border-amber-400 hover:bg-amber-400 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-400 active:scale-[0.97] disabled:cursor-not-allowed disabled:opacity-50 disabled:active:scale-100">Continue</button>
      </form>
      <p id="nicknameError" class="mt-3.5 text-[13px] text-bad" style="display:none;"></p>
    </div>
  </div>

  <script src="/icons.js"></script>
  <script src="/viz.js"></script>
  <script src="/button.js"></script>
</body>

</html>
